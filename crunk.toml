# The one source of truth for the web frontend's design system. Everything
# under web/src/styles/tokens.css is GENERATED from this file (`crunk
# tokens`); `crunk check` fails the build on any color, size, or shadow in
# CSS or a className string that is not declared here.

[project]
css_root = "web/src/styles"
# tokens_file resolves against css_root; every other *_file key
# ([tailwind] tokens_file, [tokens] json_file) resolves against the
# project root (r8, A-030) -- this split is compat law, not taste.
tokens_file = "tokens.css"
root_font_size = 16

# Blueprint palette: a technical drawing on dark drafting paper. "ink" is
# text, "paper" is the background, following crunk's role convention even
# though this UI is dark-first. "accent" is the cyan drafting line;
# "signal" is orange and RESERVED for the one primary action per screen,
# the ELO number, losses and alerts -- nothing else may use it. No purple.
[palette]
ink = "#D6E4EC"
paper = "#0B1620"
panel = "#0F1D2A"
muted = "#7F96A6"
# Hairline dividers and quiet panel edges: the accent at ~28% over paper,
# pre-mixed because alpha utilities (TW003) are banned. Decorative only,
# never text: it is deliberately absent from [palette.roles]. Input borders
# use muted (5.9:1 on paper) so form controls clear WCAG 1.4.11's 3:1
# non-text floor.
line = "#224858"
accent = "#5CC8E8"
signal = "#FF6A1F"

[palette.roles]
body = ["ink", "paper"]
panel = ["ink", "panel"]
muted = ["muted", "paper"]
accent = ["accent", "paper"]
danger = ["signal", "paper"]
# Every pair the pages actually draw, so CONTRAST001 guards all of them:
# readouts on panels, win/loss/alert text, and the primary button (paper
# text on a signal fill, flipping to a paper-on-ink hover).
muted-panel = ["muted", "panel"]
accent-panel = ["accent", "panel"]
danger-panel = ["signal", "panel"]
on-signal = ["paper", "signal"]
on-accent = ["paper", "accent"]
on-ink = ["paper", "ink"]

[scales]
spacing = [0, 4, 8, 12, 16, 24, 32, 48, 64]
font_sizes = [12, 14, 16, 20, 24, 32, 48, 64]
# Drafting-sheet corners: square. Nothing rounder than 4px is allowed and
# the pages use 0. TW005 already rejects Tailwind's own rounded-lg/2xl/full.
radii = [0, 2, 4]

# Self-hosted via @fontsource (no CDN, font-display swap), each with a system
# fallback so first paint never waits on a download. "display" (Audiowide,
# solid fill, uppercase, tracked) is for the wordmark and h1/h2 only; "mono"
# (IBM Plex Mono) is the readout face for data and labels; "base" (IBM Plex
# Sans) is body copy.
[typography]
families = [
  "IBM Plex Sans", "system-ui", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif",
  "IBM Plex Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace",
  "Audiowide",
]
weights = [400, 500, 600, 700]

[typography.stacks]
mono = ["IBM Plex Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"]
display = ["Audiowide", "system-ui", "Segoe UI", "Arial", "sans-serif"]

[layers]
base = 0
dropdown = 100
overlay = 200
toast = 300

[org]
buckets = ["base", "components", "layouts", "utilities"]
class_case = "kebab"
component_prefix = true
tokens_only_custom_props = true
# The Tailwind entry stylesheet lives beside main.tsx, not in a bucket.
ignore = ["web/src/index.css"]

# React sources: every string-literal className fragment is linted against
# the palette and scales above (TW004/TW005), so `bg-zinc-950` or `gap-2`
# is a red build, not a review comment.
[jsx]
globs = ["web/src/**/*.tsx"]

# Tailwind v4 has no JS config of its own; crunk still writes the theme
# mapping (GENERATED, never hand-edited) and web/tailwind.config.ts hands it
# to Tailwind through `@config`. namespace_keys keeps the declared scales
# out of Tailwind's default key space, so utilities read as
# `gap-space-8`, `text-font-size-20`, `rounded-radius-4`, `bg-paper` --
# there is no `gap-8` that silently means 2rem.
[tailwind]
config = "web/tailwind.config.ts"
css_entry = "web/src/index.css"
tokens_file = "web/tailwind.theme.json"
namespace_keys = true

# RADIUS001 and TW003 are promoted from crunk's default warn: an off-scale
# corner or an alpha-tinted utility (bg-accent/20 -- the glass-panel look)
# fails the build. Gradients, shadows and blur have no crunk rule; the web
# test web/tests/unit/designRules.test.ts bans those instead.
[lint]
SPACE001 = "warn"
RADIUS001 = "error"
TW003 = "error"
fix_tolerance = 0.15
color_tolerance = 8.0
