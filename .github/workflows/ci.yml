name: CI

# Development happens on branches; main only moves by pull request. Every
# job below must succeed on the PR's head before it can merge -- the
# `gate` job at the bottom is the single required status check to name in
# branch protection (see CONTRIBUTING.md). pytest xfail counts as success,
# xpass (strict) counts as failure; that is pytest's own semantics and CI
# does not soften them.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (python)
    runs-on: ubuntu-latest
    # Real PostgreSQL for the concurrent-purchase test (row-lock behaviour).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      HULLBREACH_TEST_PG_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/hbtest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install
        run: uv sync

      - name: lint
        run: uv run ruff check src/ tests/ && uv run ruff format --check src/ tests/

      - name: typecheck
        run: uv run ty check src/

      - name: test
        run: uv run pytest tests/ -n auto --cov=src --cov-report=term-missing

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install
        run: npm ci && uv sync

      - name: lint
        run: npm run lint && npx prettier --check .

      # crunk: the design-system gate. Fails on any color/size/shadow in
      # CSS or a className string that crunk.toml does not declare, and on
      # generated token files that drifted from the spec.
      - name: crunk
        run: uv run crunk check && uv run crunk tokens --check

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test:coverage

      - name: build
        run: npm run build

  frob:
    name: frob check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # frob diffs against main

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: install
        run: uv sync && npm ci

      # actions/checkout leaves HEAD detached (a pull_request merge commit
      # or a bare sha), and frob.toml's ref_mode = "branch" commits the
      # ledger to the checked-out branch, so doctor refuses a detached HEAD
      # (E-LEDGER-DETACHED). A throwaway local branch satisfies it; nothing
      # is pushed.
      - name: name the checked-out commit
        run: git switch -C ci-check

      # frob v2 (the Rust rewrite) runs as the dev pre-release binary,
      # downloaded from the lognd/frob `dev` release and sha256-verified by
      # scripts/install_frob_dev.sh. No `|| true`: a failed install is a loud,
      # non-green status, because a skipped gate is indistinguishable from
      # a passing one.
      - name: install frob (dev pre-release, sha256-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install_frob_dev.sh "$HOME/.local/bin"

      - name: frob version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/frob" --version

      # `frob check` exits 1 at or above [check] fail_on, so it is the gate.
      # v1 steps removed with the migration: `frob coverage --full
      # --fail-on-degraded` (no such verb; COV001 inside `frob check` is
      # the coverage gate now), `frob ticket sweep` (gone; `frob ticket
      # doctor` is the nearest replacement and runs below), and deriving a
      # ticket from the branch name (v2 handles are ULIDs, and `--ticket`
      # only scopes a run to a lease, which CI has none of).
      - name: frob ticket doctor
        run: frob ticket doctor

      - name: frob check
        run: |
          source .venv/bin/activate
          frob check
