body = "src/hullbreach_server/app/app.py:29-35 with config.py:95,115. allow_credentials=True, allow_methods=['*'], allow_headers=['*'] are hardcoded while allow_origins comes straight from HULLBREACH_CORS_ORIGINS. Setting it to '*' (or an attacker-influenced/overbroad value) makes Starlette reflect any Origin with credentials allowed, enabling cross-site credentialed requests. Contract: create_app must refuse or reject '*' (and non-http(s) origins) when credentials are allowed, and restrict methods/headers to those the API uses. Fix: validate cors_origins in AppConfig (field_validator) and narrow allow_methods/allow_headers; add a test that '*' is rejected."
