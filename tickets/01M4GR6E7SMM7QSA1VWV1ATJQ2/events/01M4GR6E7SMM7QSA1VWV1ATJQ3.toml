body = "origin: auditor. Invariant INV-002 (policy rule: none expressible, this frob has no pattern-rule engine; see invariants/INV-002.md). auth/schemas.py:33 RegisterRequest.password has min_length=8 only; LoginRequest (line 80) and username/email have no bounds. A multi-megabyte password is hashed by Argon2id on /register and verified on /login (CPU/memory DoS, pre-auth). Fix: Field(max_length=128) on password (login too), bounded username (e.g. 3..32 with a charset pattern) and email (<=254); add 422 tests for oversize values. Related: 01M4GR0CQQA02HKSTK8TDEV1SB covers the username cap for the failed-login store."
