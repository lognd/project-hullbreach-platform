body = "db/seed.py:127-139 (seed), :95-112 (_upsert_items), :115-140 (_create_first_admin). Contract: seed returns Result[None, SeedError] but SeedError has only MissingAdminPassword (seed.py:51). Unhandled: IntegrityError when HULLBREACH_ADMIN_USERNAME/EMAIL collides with an existing non-admin user (default username 'admin' / admin@example.com), SQLAlchemyError on connect/commit, KeyError/JSONDecodeError from seed_items.json (item['price'], seed.py:106), and no length/format validation of env username/email against the String(32)/String(254) columns. These propagate as tracebacks through __main__._db_seed (__main__.py:37-45) instead of the clean 'db seed failed' exit 1. Fix: add SeedError variants (AdminConflict, DatabaseFailure, InvalidSeedData, InvalidAdminCredentials), catch SQLAlchemyError/ValueError at the boundary with rollback, validate env inputs."
