body = "origin: auditor. Invariant INV-006 (policy rule: none expressible; see invariants/INV-006.md). web/src/auth/session.ts:32-53 stores the bearer token (14-day TTL) in window.localStorage. Any script injection exfiltrates a long-lived credential. Fix direction (needs a design decision, docs/design/sprint-1.md sec.6): keep the token in memory plus an HttpOnly SameSite cookie issued by the API, or at minimum shorten TTL and add rotation; if the cookie route is chosen revisit CORS (INV-004) and CSRF."
